      tags:
      - auth
  /auth/sso/authenticate:
    post:
      consumes:
      - application/json
      description: Exchange a short-lived SSO token for JWT access and refresh tokens
      parameters:
      - description: SSO token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.SSOAuthenticateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authentication successful
          schema:
            $ref: '#/definitions/dtos.SSOAuthenticateResponse'
      summary: Authenticate via SSO token
      tags:
      - auth
  /auth/sso/initiate:
    post:
      consumes:
      - application/json
      description: Partner site initiates SSO by sending phone number and name; returns
        a short-lived SSO token and redirect URL
      parameters:
      - description: User details from partner
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.SSOInitiateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: SSO token generated successfully
          schema:
            $ref: '#/definitions/dtos.SSOInitiateResponse'
      summary: Initiate SSO flow (Partner endpoint)
      tags:
      - auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify OTP for authentication
      parameters:
