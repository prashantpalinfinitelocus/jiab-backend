host: localhost:8080
info:
  contact: {}
  description: This is the API documentation for the Coca Cola Backend.
  title: Coca Cola Backend API
  version: "1.0"
paths:
  /admin/meme-templates/bulk-register:
    post:
      consumes:
      - application/json
      description: Registers already-uploaded GCS objects as meme templates (upload
        and registration are separate steps)
      parameters:
      - description: Templates to register
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.BulkRegisterMemeTemplatesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Registration summary
          schema:
            $ref: '#/definitions/dtos.BulkRegisterMemeTemplatesResponse'
      summary: Bulk-register meme templates
      tags:
      - Admin Meme Templates
  /admin/memes/{id}/approve:
    post:
      consumes:
      - application/json
      description: Approve a pending meme for publication
      parameters:
      - description: Meme ID
        in: path
        name: id
        required: true
        type: string
      - description: Approval details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.ApproveMemeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Meme approved successfully
          schema:
            $ref: '#/definitions/dtos.ApproveMemeResponse'
      summary: Approve a meme
      tags:
      - Admin Meme Moderation
  /admin/memes/{id}/reject:
    post:
      consumes:
      - application/json
      description: Reject a pending meme with a reason
      parameters:
      - description: Meme ID
        in: path
        name: id
        required: true
        type: string
      - description: Rejection details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.RejectMemeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Meme rejected successfully
          schema:
            $ref: '#/definitions/dtos.RejectMemeResponse'
      summary: Reject a meme
      tags:
      - Admin Meme Moderation
  /admin/memes/pending:
    get:
      consumes:
      - application/json
      description: Get a list of pending memes awaiting admin moderation
      parameters:
      - default: 15
        description: Number of results to return
        in: query
        name: limit
        type: integer
      - description: Cursor for pagination
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of pending memes
          schema:
            $ref: '#/definitions/dtos.AdminPendingMemesResponse'
      summary: List pending memes for moderation
      tags:
      - Admin Meme Moderation
  /analytics/progressive-profiling/export:
    get:
      description: Builds an .xlsx workbook of every submitted progressive-profiling
        answer (bottle count, daypart preference, comedy genre preference — see constants.ProgressiveProfilingCDPEventPrefixes)
        as CDP-shaped events, uploads it to cloud storage, and returns a signed download
        URL. Excludes Buy_Now/partner events entirely.
      produces:
      - application/json
      responses:
        "200":
          description: Signed URL to the .xlsx file in the url field
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: CDP backfill export for progressive-profiling answers
      tags:
      - Analytics
  /analytics/tokens-by-date:
    get:
      consumes:
      - application/json
      description: Get all FCM device tokens that were last modified on a specific
        date (for analytics)
      parameters:
      - description: Date in YYYY-MM-DD format (e.g., 2025-10-08)
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/dtos.GetTokensByDateResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get FCM device tokens by date
      tags:
      - Analytics
  /api/v1/avatars:
    get:
      consumes:
      - application/json
      description: Retrieves all active avatars from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.ResponseType-array_entities_Avatar'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorType'
      summary: Get all active avatars
      tags:
      - avatars
  /api/v1/location/pincode:
    get:
      consumes:
      - application/json
      description: Retrieves state and city for a given pincode
      parameters:
      - description: Pincode
        in: query
        name: pincode
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.LocationResponseDTO'
        "400":
          description: Invalid pincode format
          schema:
            $ref: '#/definitions/utils.ErrorType'
        "404":
          description: Pincode not found
          schema:
            $ref: '#/definitions/utils.ErrorType'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorType'
      summary: Get Location Details by Pincode
      tags:
      - location
  /auth/WA/validate-contact-no:
    post:
      consumes:
      - application/json
      description: Check if a contact number is already registered
      parameters:
      - description: Contact Number
        in: query
